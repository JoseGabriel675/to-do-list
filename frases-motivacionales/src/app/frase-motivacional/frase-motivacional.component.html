<ion-card>
  <ion-card-header>
    <ion-card-title class="ion-text-center">
      Frase del Día
    </ion-card-title>
  </ion-card-header>

  <ion-card-content class="ion-text-center">
    <p>{{ fraseActual }}</p>

    <ion-button expand="block" color="success" (click)="mostrarFraseAleatoria()">
      Mostrar nueva frase
    </ion-button>
  </ion-card-content>
</ion-card>
